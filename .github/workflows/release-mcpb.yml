# Builds the Claude Desktop extension (wilmai.mcpb) for each CLI release and
# attaches it to that release and to the rolling "claude-desktop" release, which
# https://wilm.ai/get/claude points to. A fixed release (rather than
# releases/latest) keeps the link working when a wilma-client release is newer.
name: Release Claude Desktop extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: CLI release tag to build (e.g. wilma-cli@1.7.0)
        required: true

permissions:
  contents: write

jobs:
  mcpb:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'wilma-cli@')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tagged code, also for manual runs (which default to main).
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wilm-ai/wilma-client build
      - run: pnpm --filter @wilm-ai/wilma-cli build:mcpb
      - name: Attach wilmai.mcpb to the release and the rolling download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=packages/wilma-cli/build/wilmai.mcpb
          gh release upload "$TAG" "$bundle" --clobber
          if ! gh release view claude-desktop >/dev/null 2>&1; then
            gh release create claude-desktop --target "$(git rev-parse HEAD)" --latest=false \
              --title "Claude Desktop extension" --notes "The newest wilmai.mcpb (https://wilm.ai/get/claude)."
          fi
          gh release upload claude-desktop "$bundle" --clobber
          gh release edit claude-desktop --latest=false \
            --notes "The newest wilmai.mcpb (https://wilm.ai/get/claude), built from $TAG."
